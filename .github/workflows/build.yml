name: Build NeoDesk

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build skin package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoDesk-build
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
