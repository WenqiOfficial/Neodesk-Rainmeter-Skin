[Rainmeter]
Update=0
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=NeoDesk Visualizer
Author=WenqiOfficial
Information=121-band audio visualizer with optional reflection.
License=MIT
Version=dev

[Variables]
@include=#@#Theme\Settings.inc
BarRefl=255,255,255,50
LineColor=255,255,255

; ---------------- Audio Engine (音频主引擎) ----------------
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTOverlap=128
FFTAttack=20
FFTDecay=150
FreqMin=130
FreqMax=16500
Sensitivity=32
Bands=121

